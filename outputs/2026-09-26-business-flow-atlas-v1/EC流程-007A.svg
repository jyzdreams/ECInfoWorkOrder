" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >同步显示备货进度</text><text x="1700" y="823" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >仓库通 → EC；匹配关联</text><text x="1700" y="844" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >单据</text></g><g data-node="h"><rect x="1685" y="245" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1685" y="245" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1700" y="268" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >08</text><text x="1700" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >核对规格、数量及齐</text><text x="1700" y="320" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >套</text><text x="1700" y="344" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >异常反馈仓库通处理</text></g><g data-node="i"><rect x="1970" y="245" width="236" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1970" y="245" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1985" y="268" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >09  接续</text><text x="1985" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >具备施工条件</text><text x="1985" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >接 FLOW-007B</text></g><rect x="40" y="908" width="2200" height="76" rx="8" fill="#FFF4DE" stroke="none" /><text x="57" y="935" font-size="18" font-weight="600" fill="#AC6812" text-anchor="start" >待确认 / 阅读提示</text><text x="250" y="935" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >有货与缺货可覆盖部分备货；具体回传字段、状态值、时效、失败处理均待确认。</text><text x="250" y="964" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >本主链路按齐套后派施工；部分货到先派、紧急施工、无需物料的规则仍待确认。</text><text x="42" y="1008" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >来源：用户明确仓库通边界、纯 SOP 0