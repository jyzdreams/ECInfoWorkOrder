size="15" font-weight="500" fill="#2563A5" text-anchor="start" >07</text><text x="1700" y="626" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >安排关联工单 / 派</text><text x="1700" y="652" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >工</text><text x="1700" y="676" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >恢复原单或新建关联单：待</text><text x="1700" y="697" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >定</text></g><g data-node="h"><rect x="1685" y="1075" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1685" y="1075" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1700" y="1098" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >08</text><text x="1700" y="1124" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >接单 / 领料 / 施</text><text x="1700" y="1150" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >工</text><text x="1700" y="1174" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >到场、处理前后记录</text></g><g data-node="i"><rect x="1970" y="411" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1970" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1985" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >09</text><text x="1985" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >现场确认</text><text x="1985" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >签名 / 盖章</text></g><g data-node="j"><rect x="1970" y="1075" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1970" y="1075" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1985" y="1098" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >10</text><text x="1985" y="1124" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >提交 SR / 完工单</text><text x="1985" y="1155" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >报告及附件</text></g><g data-node="k"><rect x="1970" y="909" width="236" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1970" y="909" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1985" y="932" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >11  接续</text><text x="1985" y="958" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >完成及报告归档</text><text x="1985" y="989" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >完成规则见 FLOW-005</text></g><rect x="40" y="1240" width="2200" height="76" rx="8" fill="#FFF4DE" stroke="none" /><text x="57" y="1267" font-size="18" font-weight="600" fill="#AC6812" text-anchor="start" >待确认 / 阅读提示</text><text x="250" y="1267" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >后补报价且现场已经完成，不自动重复备货施工；有新增施工需求时才进入该分支。</text><text x="250" y="1296" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >开票收款是 FLOW-011 商务分支；不是所有工单完成的强制前置条件。</text><text x="42" y="1340" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >来源：本轮用户主链路、纯 SOP 02；争议：AT-Q01～06、AT-Q10</text><text x="2238" y="1340" font-size="17" font-weight="500" fill="#5C6C7D" text-anchor="end" >图 001B / 需求评审草案</text></g></svg>