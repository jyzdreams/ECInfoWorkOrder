" text-anchor="start" >03</text><text x="873.3333333333334" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >发出任务通知</text><text x="873.3333333333334" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >内容、地址、联系人、时间</text></g><g data-node="d"><rect x="1157.5" y="577" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1157.5" y="577" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1172.5" y="600" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >04</text><text x="1172.5" y="626" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >本人任务：确认收到</text><text x="1172.5" y="657" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >拒单须记录原因</text></g><g data-node="e"><rect x="858.3333333333334" y="577" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="858.3333333333334" y="577" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="873.3333333333334" y="600" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >05</text><text x="873.3333333333334" y="626" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >团队任务：申请接单</text><text x="873.3333333333334" y="657" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >发起接单申请</text></g><g data-node="f"><rect x="1157.5" y="743" width="248" height="128" rx="24" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1157.5" y="743" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1172.5" y="766" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >06  判断</text><text x="1172.5" y="792" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >审批接单申请</text><text x="1172.5" y="823" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >通过 / 不通过</text></g><g data-node="g"><rect x="1456.6666666666667" y="245" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1456.6666666666667" y="245" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1471.6666666666667" y="268" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >07</text><text x="1471.6666666666667" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >改派 / 继续招领</text><text x="1471.6666666666667" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >拒单、申请不通过或无人接</text></g><g data-node="h"><rect x="1755.8333333333335" y="577" width="248" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1755.8333333333335" y="577" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1770.8333333333335" y="600" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >08  接续</text><text x="1770.8333333333335" y="626" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >接单后准备到场</text><text x="1770.8333333333335" y="657" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >接 FLOW-004 现场处理</text></g><rect x="40" y="908" width="2000" height="76" rx="8" fill="#FFF4DE" stroke="none" /><text x="57" y="935" font-size="18" font-weight="600" fill="#AC6812" text-anchor="start" >待确认 / 阅读提示</text><text x="250" y="935" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >接单申请审批与完工审核不是同一流程，不能混用同一个“待审批”。</text><text x="250" y="964" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >CM 与 PM 排程冲突时接 FLOW-009；CS / CR / Project 的分派权限待确认。</text><text x="42" y="1008" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >来源：纯 SOP 01/02、知识库 FLOW-003；单据：工单 / 接单申请；待确认：Q-005、Q-012</text><text x="2038" y="1008" font-size="17" font-weight="500" fill="#5C6C7D" text-anchor="end" >图 003 / 需求评审草案</text></g></svg>