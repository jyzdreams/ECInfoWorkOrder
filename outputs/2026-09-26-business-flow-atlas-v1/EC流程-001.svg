<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1440" viewBox="0 0 2080 1440" role="img" aria-labelledby="title desc"><title id="title">FLOW-001 全项目业务流程总览</title><desc id="desc">四类业务入口，共用交付链路；沿用知识库 12 个流程组。仓库通负责备货执行并向 EC 回传状态；MR 交接方式及状态字典待确认。。本图为业务全貌；一期范围、原型覆盖率与客户定稿状态需另行确认。</desc><defs><marker id="arr-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563A5"/></marker><marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168373"/></marker><marker id="arr-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#AC6812"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="2080" height="1440" rx="0" fill="#F4F7FA" stroke="none" /><rect x="0" y="0" width="2080" height="172" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="35" width="145" height="33" rx="6" fill="#182B42" stroke="none" /><text x="112" y="58" font-size="18" font-weight="500" fill="#fff" text-anchor="middle" >FLOW-001</text><text x="202" y="58" font-size="19" font-weight="400" fill="#5C6C7D" text-anchor="start" >EC 工单系统 · 业务流程图册</text><text x="2038" y="58" font-size="19" font-weight="500" fill="#AC6812" text-anchor="end" >草案 / 待确认 · 2026-09-26</text><text x="40" y="112" font-size="36" font-weight="600" fill="#182B42" text-anchor="start" >全项目业务流程总览</text><text x="40" y="149" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >四类业务入口，共用交付链路；沿用知识库 12 个流程组</text><text x="40" y="210" font-size="22" font-weight="600" fill="#182B42" text-anchor="start" >A  四类业务入口</text><rect x="40" y="237" width="448" height="135" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="40" y="237" width="6" height="135" rx="2" fill="#2563A5" stroke="none" /><text x="64" y="278" font-size="27" font-weight="600" fill="#182B42" text-anchor="start" >客户来电 / WhatsApp</text><text x="64" y="316" font-size="22" font-weight="400" fill="#5C6C7D" text-anchor="start" >答疑 / 投诉 / 来电转工单</text><text x="64" y="349" font-size="21" font-weight="500" fill="#2563A5" text-anchor="start" >FLOW-002 → FLOW-003</text><rect x="557" y="237" width="448" height="135" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="557" y="237" width="6" height="135" rx="2" fill="#168373" stroke="none" /><text x="581" y="278" font-size="27" font-weight="600" fill="#182B42" text-anchor="start" >日常保养 / PM 排程</text><text x="581" y="316" font-size="22" font-weight="400" fill="#5C6C7D" text-anchor="start" >安排任务 → 接单 → 到場保养</text><text x="581" y="349" font-size="21" font-weight="500" fill="#168373" text-anchor="start" >FLOW-003 → FLOW-004</text><rect x="1074" y="237" width="448" height="135" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1074" y="237" width="6" height="135" rx="2" fill="#168373" stroke="none" /><text x="1098" y="278" font-size="27" font-weight="600" fill="#182B42" text-anchor="start" >客户直接报价需求</text><text x="1098" y="316" font-size="22" font-weight="400" fill="#5C6C7D" text-anchor="start" >报价 → 修订 → 中单</text><text x="1098" y="349" font-size="21" font-weight="500" fill="#168373" text-anchor="start" >从 C 区 FLOW-006 进入</text><rect x="1591" y="237" width="448" height="135" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1591" y="237" width="6" height="135" rx="2" fill="#7857A7" stroke="none" /><text x="1615" y="278" font-size="27" font-weight="600" fill="#182B42" text-anchor="start" >标书 / 招投标</text><text x="1615" y="316" font-size="22" font-weight="400" fill="#5C6C7D" text-anchor="start" >标书 → 回标 → M / P / M+P</text><text x="1615" y="349" font-size="21" font-weight="500" fill="#7857A7" text-anchor="start" >FLOW-010A → 010B / 010C</text><text x="40" y="435" font-size="22" font-weight="600" fill="#182B42" text-anchor="start" >B  共享的服务交付流程</text><rect x="40" y="463" width="448" height="129" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><text x="62" y="493" font-size="18" font-weight="500" fill="#2563A5" text-anchor="start" >FLOW-003</text><text x="62" y="534" font-size="27" font-weight="500" fill="#182B42" text-anchor="start" >分派与接单</text><text x="62" y="572" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >直接派单 / 团队申请</text><path d="M489 526H540" fill="none" stroke="#2563A5" stroke-width="3" marker-end="url(#arr-main)"/><rect x="557" y="463" width="448" height="129" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><text x="579" y="493" font-size="18" font-weight="500" fill="#2563A5" text-anchor="start" >FLOW-004</text><text x="579" y="534" font-size="27" font-weight="500" fill="#182B42" text-anchor="start" >现场检查与处理</text><text x="579" y="572" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >可即时完成 / 需报价</text><path d="M1006 526H1057" fill="none" stroke="#2563A5" stroke-width="3" marker-end="url(#arr-main)"/><rect x="1074" y="463" width="448" height="129" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><text x="1096" y="493" font-size="18" font-weight="500" fill="#2563A5" text-anchor="start" >FLOW-005</text><text x="1096" y="534" font-size="27" font-weight="500" fill="#182B42" text-anchor="start" >完工确认</text><text x="1096" y="572" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >直接完成或审核待定</text><path d="M1523 526H1574" fill="none" stroke="#2563A5" stroke-width="3" marker-end="url(#arr-main)"/><rect x="1591" y="463" width="448" height="129" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><text x="1613" y="493" font-size="18" font-weight="500" fill="#2563A5" text-anchor="start" >FLOW-008</text><text x="1613" y="534" font-size="27" font-weight="500" fill="#182B42" text-anchor="start" >报告归档与发送</text><text x="1613" y="572" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >SR / 完工单 / 附件</text><path d="M350 372V400H490V447M780 372V400H490" fill="none" stroke="#2563A5" stroke-width="2.5"/><text x="1074" y="409" font-size="19" font-weight="400" fill="#5C6C7D" text-anchor="start" >直接报价接 C 区；中标后按 M/P 分流再接备货或派工。</text><text x="40" y="666" font-size="22" font-weight="600" fill="#182B42" text-anchor="start" >C  报价中单后的施工回路</text><text x="725" y="666" font-size="21" font-weight="500" fill="#168373" text-anchor="start" >重点主链路详见 FLOW-001B</text><rect x="40" y="697" width="448" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><text x="62" y="728" font-size="18" font-weight="500" fill="#168373" text-anchor="start" >FLOW-006</text><text x="62" y="768" font-size="26" font-weight="500" fill="#182B42" text-anchor="start" >报价 / 修订 / 中单</text><text x="62" y="806" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >客户确认成交版本</text><path d="M489 760H540" fill="none" stroke="#168373" stroke-width="3" marker-end="url(#arr-dashed)"/><rect x="557" y="697" width="448" height="130" rx="12" fill="#ECF7F3" stroke="#CBD5DF" /><text x="579" y="728" font-size="18" font-weight="500" fill="#168373" text-anchor="start" >FLOW-007A</text><text x="579" y="768" font-size="26" font-weight="500" fill="#182B42" text-anchor="start" >MR / 仓库通备货</text><text x="579" y="806" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >外部备货 → EC 状态回传</text><path d="M1006 760H1057" fill="none" stroke="#168373" stroke-width="3" marker-end="url(#arr-dashed)"/><rect x="1074" y="697" width="448" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><text x="1096" y="728" font-size="18" font-weight="500" fill="#168373" text-anchor="start" >FLOW-007B</text><text x="1096" y="768" font-size="26" font-weight="500" fill="#182B42" text-anchor="start" >后续施工与派工</text><text x="1096" y="806" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >确认施工条件 → 领料</text><path d="M1523 760H1574" fill="none" stroke="#168373" stroke-width="3" marker-end="url(#arr-dashed)"/><rect x="1591" y="697" width="448" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><text x="1613" y="728" font-size="18" font-weight="500" fill="#168373" text-anchor="start" >接回 FLOW-004/005</text><text x="1613" y="768" font-size="26" font-weight="500" fill="#182B42" text-anchor="start" >现场执行 → 完工</text><text x="1613" y="806" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >再进入报告归档</text><path d="M778 592V624H263V691" fill="none" stroke="#168373" stroke-width="2.5" marker-end="url(#arr-dashed)"/><text x="365" y="618" font-size="18" font-weight="500" fill="#168373" text-anchor="start" >无法即时处理 / 需要报价</text><text x="40" y="876" font-size="22" font-weight="400" fill="#5C6C7D" text-anchor="start" >说明：报价可直接从客户需求发起；已完成工作的后补报价，不自动再走备货施工。</text><text x="40" y="948" font-size="22" font-weight="600" fill="#182B42" text-anchor="start" >D  横向协作与系统支撑</text><rect x="40" y="978" width="620" height="123" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><text x="63" y="1009" font-size="18" font-weight="500" fill="#2563A5" text-anchor="start" >FLOW-009</text><text x="63" y="1048" font-size="27" font-weight="500" fill="#182B42" text-anchor="start" >CM / PM 冲突与重排</text><text x="63" y="1081" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >接受 CM 重排 PM / 拒绝 CM 重派</text><rect x="730" y="978" width="620" height="123" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><text x="753" y="1009" font-size="18" font-weight="500" fill="#2563A5" text-anchor="start" >FLOW-011</text><text x="753" y="1048" font-size="27" font-weight="500" fill="#182B42" text-anchor="start" >开票 / 收款 / 财务</text><text x="753" y="1081" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >独立商务分支，开票时点待确认</text><rect x="1420" y="978" width="620" height="123" rx="12" fill="#FFFFFF" stroke="#CBD5DF" /><text x="1443" y="1009" font-size="18" font-weight="500" fill="#2563A5" text-anchor="start" >FLOW-012</text><text x="1443" y="1048" font-size="27" font-weight="500" fill="#182B42" text-anchor="start" >账号 / 权限 / 基础资料</text><text x="1443" y="1081" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >支撑所有业务流程</text><rect x="40" y="1134" width="2000" height="105" rx="10" fill="#E7EEF5" stroke="none" /><text x="63" y="1174" font-size="29" font-weight="600" fill="#182B42" text-anchor="start" >12 个流程组 → 16 张效果图</text><text x="63" y="1215" font-size="22" font-weight="400" fill="#5C6C7D" text-anchor="start" >001 总览及重点主链路 ×2  ·  007 备货与施工 ×2  ·  010 标书与中标分流 ×3  ·  其余 9 组各 1 张</text><rect x="40" y="1298" width="2000" height="76" rx="8" fill="#FFF4DE" stroke="none" /><text x="57" y="1325" font-size="18" font-weight="600" fill="#AC6812" text-anchor="start" >待确认 / 阅读提示</text><text x="250" y="1325" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >仓库通负责备货执行并向 EC 回传状态；MR 交接方式及状态字典待确认。</text><text x="250" y="1354" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >本图为业务全貌；一期范围、原型覆盖率与客户定稿状态需另行确认。</text><text x="42" y="1418" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >来源：纯 SOP 01/02/03、知识库 FLOW-001～012、本轮用户说明</text><text x="2038" y="1418" font-size="17" font-weight="500" fill="#5C6C7D" text-anchor="end" >图 001 / 需求评审草案</text></g></svg>