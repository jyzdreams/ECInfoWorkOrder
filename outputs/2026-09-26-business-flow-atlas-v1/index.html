<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EC 工单业务流程图册</title><style>*{box-sizing:border-box}body{margin:0;background:#eff3f7;color:#182b42;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{padding:22px 30px;background:#172d43;color:white}header h1{font-size:24px;margin:0 0 6px}header p{margin:0;color:#d0deeb}.layout{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}nav{background:white;padding:18px 12px;border-right:1px solid #d5dfe8}.flow-button{display:block;width:100%;padding:12px 14px;margin:0 0 4px;border:0;text-align:left;border-radius:7px;background:transparent;color:#253d53;font:inherit;cursor:pointer}.flow-button span{display:block;font-size:11px;letter-spacing:.04em;color:#5c6c7d}.flow-button:hover{background:#eef4fa}.flow-button[aria-pressed=true]{background:#e3f0fc;color:#15548b;font-weight:600}main{min-width:0;padding:22px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h2{margin:0;font-size:21px;flex:1 1 500px}a,button,select{font:inherit}a{color:#1f5c91}button.control{padding:7px 12px;background:white;border:1px solid #c6d1dc;border-radius:6px;cursor:pointer}.paper{background:white;overflow:auto;max-height:none;border-radius:8px;box-shadow:0 5px 20px #1021330c}.paper img{display:block;width:100%;height:auto;max-width:none}.notes{padding:20px 3px;max-width:1150px}.notes p{margin:5px 0}.hint{color:#915810}footer{padding:20px;color:#53677a;border-top:1px solid #cbd5df}.small{font-size:13px;color:#637486}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #3185cc;outline-offset:3px}@media(max-width:850px){.layout{display:block}nav{display:flex;overflow:auto;padding:10px;gap:6px}.flow-button{min-width:205px;margin:0}main{padding:12px}header{padding:18px}h2{font-size:18px}}</style><header><h1>EC 工单系统 · 全流程效果图</h1><p>12 个流程组 / 16 张图 · 2026-09-26 · 草案 / 待确认 · 仓库通负责备货并回传状态</p></header><div class="layout"><nav aria-label="流程目录"><button class="flow-button" data-id="001" aria-pressed="false"><span>FLOW-001</span>全项目业务流程总览</button><button class="flow-button" data-id="001B" aria-pressed="false"><span>FLOW-001 · 重点链路</span>报价 → 中单 → 备货 → 派工 → 完工</button><button class="flow-button" data-id="002" aria-pressed="false"><span>FLOW-002</span>来电受理、答疑与投诉跟进</button><button class="flow-button" data-id="003" aria-pressed="false"><span>FLOW-003</span>分派、团队接单申请与拒单改派</button><button class="flow-button" data-id="004" aria-pressed="false"><span>FLOW-004</span>到场处理、现场报价与后补报价</button><button class="flow-button" data-id="005" aria-pressed="false"><span>FLOW-005</span>完工提交、确认与退回处理</button><button class="flow-button" data-id="006" aria-pressed="false"><span>FLOW-006</span>报价编制、修订、客户确认与中单</button><button class="flow-button" data-id="007A" aria-pressed="false"><span>FLOW-007</span>MR 物料申请与仓库通备货状态同步</button><button class="flow-button" data-id="007B" aria-pressed="false"><span>FLOW-007</span>备货后派工、领料与后续施工</button><button class="flow-button" data-id="008" aria-pressed="false"><span>FLOW-008</span>服务报告、附件归档与客户发送</button><button class="flow-button" data-id="009" aria-pressed="false"><span>FLOW-009</span>CM 插单与原 PM 排程重安排</button><button class="flow-button" data-id="010A" aria-pressed="false"><span>FLOW-010</span>标书取得、报价与正式回标</button><button class="flow-button" data-id="010B" aria-pressed="false"><span>FLOW-010</span>中标后的 M 保养线与 P 工程线</button><button class="flow-button" data-id="010C" aria-pressed="false"><span>FLOW-010</span>M+P 混合项目：先工程，再保养</button><button class="flow-button" data-id="011" aria-pressed="false"><span>FLOW-011</span>开票、收款与财务协作</button><button class="flow-button" data-id="012" aria-pressed="false"><span>FLOW-012</span>账号、角色权限与基础资料维护</button></nav><main><div class="bar"><h2 id="heading"></h2><label>缩放 <select id="zoom"><option value="100">适合宽度</option><option value="150">150%</option><option value="200">200%</option></select></label><a id="png" target="_blank">高清 PNG</a><a id="svg" target="_blank">矢量 SVG</a><a href="EC工单系统-全业务流程图册-评审草案.pdf" target="_blank">整本 PDF</a></div><div class="paper" tabindex="0" aria-label="当前流程图，可放大后滚动"><img id="diagram" alt=""/></div><div class="notes" aria-live="polite"><p id="subtitle"></p><p id="note1" class="hint"></p><p id="note2" class="hint"></p><p id="source" class="small"></p></div><footer>图中编号沿用知识库 FLOW-001 至 FLOW-012。业务流程已绘制，不代表原型已实现或客户已批准。<br>MR 的建单入口、同步字段、完工审核和开票时点等待确认项保留在对应图中。</footer></main></div><script>const diagrams=[{"id":"001","title":"全项目业务流程总览","subtitle":"四类业务入口，共用交付链路；沿用知识库 12 个流程组","notes":["仓库通负责备货执行并向 EC 回传状态；MR 交接方式及状态字典待确认。","本图为业务全貌；一期范围、原型覆盖率与客户定稿状态需另行确认。"],"sources":"来源：纯 SOP 01/02/03、知识库 FLOW-001～012、本轮用户说明","stem":"EC流程-001"},{"id":"001B","title":"报价 → 中单 → 备货 → 派工 → 完工","subtitle":"本轮记录的重点主链路｜按“备货核对后安排施工”展示，例外待确认","notes":["后补报价且现场已经完成，不自动重复备货施工；有新增施工需求时才进入该分支。","开票收款是 FLOW-011 商务分支；不是所有工单完成的强制前置条件。"],"sources":"来源：本轮用户主链路、纯 SOP 02；争议：AT-Q01～06、AT-Q10","stem":"EC流程-001B"},{"id":"002","title":"来电受理、答疑与投诉跟进","subtitle":"入口：客户来电 / WhatsApp｜结束：已解决、投诉已跟进，或转现场工单","notes":["投诉需保留处理结果；不因“投诉”一律重复创建新工单。","无效、重复或客户取消应记录原因；取消权限和编号规则待客户确认。"],"sources":"来源：纯 SOP 01、知识库 FLOW-002；单据：来电记录 / CALL；待确认：Q-010、Q-012","stem":"EC流程-002"},{"id":"003","title":"分派、团队接单申请与拒单改派","subtitle":"入口：待分派任务 / PM 排程 / 备货后施工｜结束：师傅确认接单","notes":["接单申请审批与完工审核不是同一流程，不能混用同一个“待审批”。","CM 与 PM 排程冲突时接 FLOW-009；CS / CR / Project 的分派权限待确认。"],"sources":"来源：纯 SOP 01/02、知识库 FLOW-003；单据：工单 / 接单申请；待确认：Q-005、Q-012","stem":"EC流程-003"},{"id":"004","title":"到场处理、现场报价与后补报价","subtitle":"入口：师傅已接单｜即时完成和无法即时处理必须分开","notes":["不可拍照地点的替代证明、迟到通知阈值、照片要求均待确认；不套用原型演示阈值。","后补报价不等于一定需要二次施工；同一工单多份 SR 是否全部齐备，完工时要核对。"],"sources":"来源：纯 SOP 02、知识库 FLOW-004/006；单据：SR 服务报告、完工纸；待确认：Q-009、Q-011、Q-015","stem":"EC流程-004"},{"id":"005","title":"完工提交、确认与退回处理","subtitle":"“直接完成”与“主管审核”是待选方案；客户签认已在现场流程中完成","notes":["A/B 为互斥候选，不能把两条都当成客户已经同意的必经流程。","业务处理未完不因上传过一次 SR 就自动关单；最终完成条件需要真实案例确认。"],"sources":"来源：知识库 FLOW-005、对齐审计；冲突：Q-003、Q-004；本图不确认任何一套状态枚举","stem":"EC流程-005"},{"id":"006","title":"报价编制、修订、客户确认与中单","subtitle":"入口：客户需求 / SR 报价请求 / 后补报价｜按客户确认版本登记成交","notes":["修订是可选循环，不是每张报价的必经步骤；已中单后变更范围或价钱的规则待确认。","客户 PO 是成交凭据；仓库通对供应商的采购 PO 是另一份单据。"],"sources":"来源：本轮用户说明、纯 SOP 02、知识库 FLOW-006；待确认：Q-016、AT-Q10","stem":"EC流程-006"},{"id":"007A","title":"MR 物料申请与仓库通备货状态同步","subtitle":"系统边界已明确：备货在仓库通执行，EC 接收状态；具体接口仍待确认","notes":["有货与缺货可覆盖部分备货；具体回传字段、状态值、时效、失败处理均待确认。","本主链路按齐套后派施工；部分货到先派、紧急施工、无需物料的规则仍待确认。"],"sources":"来源：用户明确仓库通边界、纯 SOP 02/03、FLOW-007；单据：MR / 仓库单 / 采购 PO；AT-Q01～03","stem":"EC流程-007A"},{"id":"007B","title":"备货后派工、领料与后续施工","subtitle":"入口：所需货品核对完成｜适用于首次施工与报价后的二次上门","notes":["工单号与原报价 / 原工单的关联须连续；不预设 (2) 后缀或自动生成时点。","材料不符回 007A；现场新增工程或需再报价回 004/006，不直接把工单做完。"],"sources":"来源：纯 SOP 02 E 段、FLOW-007；待确认：Q-017、AT-Q03/04；输出：现场完工资料","stem":"EC流程-007B"},{"id":"008","title":"服务报告、附件归档与客户发送","subtitle":"入口：已提交的现场资料｜同一工单可关联多份服务报告","notes":["归档可以持续积累；上传中间报告不代表整张工单已经完成。","保留周期、命名、编辑时限、发送渠道及失败补发规则待确认。"],"sources":"来源：知识库 FLOW-008、0702 资料及对齐审计；单据：SR / 完工纸；待确认：Q-014/015/019","stem":"EC流程-008"},{"id":"009","title":"CM 插单与原 PM 排程重安排","subtitle":"SOP 保留师傅接受与不接受两条路径；CM/PM 正式分类映射仍待确认","notes":["接受 CM 不等于删除原 PM 工作；原任务须明确重新安排及承接人。","原型部分场景隐藏拒绝按钮，与 SOP 有冲突；本图不据此取消师傅选择权。"],"sources":"来源：纯 SOP 01、FLOW-009、对齐审计；待确认：Q-008、Q-012；PM/CM 与 M/P 不是同一分类","stem":"EC流程-009"},{"id":"010A","title":"标书取得、报价与正式回标","subtitle":"入口：主动寻找或被动接收标书｜结束：未中标归档，或进入中标后分流","notes":["标书中标入口与普通报价中单入口有关联，但不能用一个“中单”按钮代替全部回标过程。","现有审计指出导出 / 回标入口未形成可执行闭环；本图是业务要求，非功能完成声明。"],"sources":"来源：纯 SOP 03 A 段、FLOW-010、对齐审计；待确认：Q-018；单据：标书、报价表、回标记录","stem":"EC流程-010A"},{"id":"010B","title":"中标后的 M 保养线与 P 工程线","subtitle":"M、P 两条独立责任线；都可复用备货、派工、现场处理和完工流程","notes":["共用仓库泳道不代表 M/P 合并成同一张单；需求、材料和执行记录仍须各自可追溯。","M 的周期保养频率、自动排程及 Project 独立角色范围待确认。"],"sources":"来源：纯 SOP 03 M/P 分支、用户仓库通说明；待确认：Q-006、Q-018；M+P 另见 010C","stem":"EC流程-010B"},{"id":"010C","title":"M+P 混合项目：先工程，再保养","subtitle":"保留 SOP“先 P 后 M”顺序；转交条件、负责人与具体时点仍需客户确认","notes":["图中串行的是 P → M 业务交接；长期保养何时算完成，不在本图中擅自设定。","SOP 中“?组 / ?主管”仍待明确，不能直接用 TL 代替最终项目责任人。"],"sources":"来源：纯 SOP 03 M+P、SOP 提取“先走P…完成后再走M”；待确认：Q-006、Q-018","stem":"EC流程-010C"},{"id":"011","title":"开票、收款与财务协作","subtitle":"商务流程与工单执行关联；开票时点及财务系统集成未定稿","notes":["“工单已完成”和“已收款”是两件事，不能共用同一完成状态或一律互相阻断。","长期保养多次开票、Peachtree / OCS 同步方向及频率仍待真实资料与接口验证。"],"sources":"来源：纯 SOP 02、知识库 FLOW-011；单据：发票 / 收据 / 收款记录；待确认：Q-021、AT-Q08","stem":"EC流程-011"},{"id":"012","title":"账号、角色权限与基础资料维护","subtitle":"支撑流程｜为业务流程提供人员、客户、地点和访问范围","notes":["这是基础支撑流程，不与报价 / 派工等计作同一种客户服务入口。","正式角色权限矩阵、账号开停用责任和 Project/仓务是否独立账号仍待确认。"],"sources":"来源：知识库 FLOW-012、现有需求与审计；待确认：Q-006、Q-012、Q-020","stem":"EC流程-012"}];function show(id){const f=diagrams.find(x=>x.id===id)||diagrams[0];document.querySelectorAll('[data-id]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===f.id));document.getElementById('heading').textContent=f.title;const img=document.getElementById('diagram');img.src=f.stem+'.png';img.alt=f.title;document.getElementById('png').href=f.stem+'.png';document.getElementById('svg').href=f.stem+'.svg';for(const [id,value] of [['subtitle',f.subtitle],['note1',f.notes[0]],['note2',f.notes[1]],['source',f.sources]])document.getElementById(id).textContent=value;history.replaceState(null,'','#'+f.id);}document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.id)));document.getElementById('zoom').addEventListener('change',e=>document.getElementById('diagram').style.width=e.target.value+'%');show(location.hash.slice(1));</script></html>
