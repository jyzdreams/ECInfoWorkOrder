="22" font-weight="500" fill="#182B42" text-anchor="start" >整理成交与服务资料</text><text x="275" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >报价、客户 PO、完工证明</text></g><g data-node="b"><rect x="559.1666666666667" y="245" width="248" height="128" rx="11" fill="#FFF4DE" stroke="#D6A551" stroke-dasharray="5 4"/><rect x="559.1666666666667" y="245" width="5" height="128" rx="2" fill="#AC6812" stroke="none" /><text x="574.1666666666667" y="268" font-size="15" font-weight="500" fill="#AC6812" text-anchor="start" >02  待确认</text><text x="574.1666666666667" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >满足合同开票条件？</text><text x="574.1666666666667" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >中单 / 完工 / 周期 / 分</text><text x="574.1666666666667" y="346" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >期</text></g><g data-node="c"><rect x="858.3333333333334" y="411" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="858.3333333333334" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="873.3333333333334" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >03</text><text x="873.3333333333334" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >审核资料并开票</text><text x="873.3333333333334" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >按实际开票条件办理</text></g><g data-node="d"><rect x="1157.5" y="245" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1157.5" y="245" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1172.5" y="268" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >04</text><text x="1172.5" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >发送发票 / 跟进</text><text x="1172.5" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >发送责任人待确认</text></g><g data-node="e"><rect x="1456.6666666666667" y="577" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1456.6666666666667" y="577" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1471.6666666666667" y="600" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >05</text><text x="1471.6666666666667" y="626" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >支付款项</text><text x="1471.6666666666667" y="657" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >按约定付款条件</text></g><g data-node="f"><rect x="1755.8333333333335" y="411" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1755.8333333333335" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1770.8333333333335" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >06</text><text x="1770.8333333333335" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >核对收款 / 收据</text><text x="1770.8333333333335" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >按实际账务确认</text></g><g data-node="g"><rect x="1755.8333333333335" y="743" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1755.8333333333335" y="743" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1770.8333333333335" y="766" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >07</text><text x="1770.8333333333335" y="792" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >同步或登记收款记录</text><text x="1770.8333333333335" y="823" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >接口 / 补录责任待确认</text></g><g data-node="h"><rect x="1456.6666666666667" y="245" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1456.6666666666667" y="245" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1471.6666666666667" y="268" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >08</text><text x="1471.6666666666667" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >到期未付：跟进</text><text x="1471.6666666666667" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >保持真实未收款记录</text></g><rect x="40" y="908" width="2000" height="76" rx="8" fill="#FFF4DE" stroke="none" /><text x="57" y="935" font-size="18" font-weight="600" fill="#AC6812" text-anchor="start" >待确认 / 阅读提示</text><text x="250" y="935" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >“工单已完成”和“已收款”是两件事，不能共用同一完成状态或一律互相阻断。</text><text x="250" y="964" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >长期保养多次开票、Peachtree / OCS 同步方向及频率仍待真实资料与接口验证。</text><text x="42" y="1008" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >来源：纯 SOP 02、知识库 FLOW-011；单据：发票 / 收据 / 收款记录；待确认：Q-021、AT-Q08</text><text x="2038" y="1008" font-size="17" font-weight="500" fill="#5C6C7D" text-anchor="end" >图 011 / 需求评审草案</text></g></svg>