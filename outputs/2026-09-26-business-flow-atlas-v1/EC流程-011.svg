<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1030" viewBox="0 0 2080 1030" role="img" aria-labelledby="title desc"><title id="title">FLOW-011 开票、收款与财务协作</title><desc id="desc">商务流程与工单执行关联；开票时点及财务系统集成未定稿。“工单已完成”和“已收款”是两件事，不能共用同一完成状态或一律互相阻断。。长期保养多次开票、Peachtree / OCS 同步方向及频率仍待真实资料与接口验证。</desc><defs><marker id="arr-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563A5"/></marker><marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168373"/></marker><marker id="arr-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#AC6812"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="2080" height="1030" rx="0" fill="#F4F7FA" stroke="none" /><rect x="0" y="0" width="2080" height="172" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="35" width="145" height="33" rx="6" fill="#182B42" stroke="none" /><text x="112" y="58" font-size="18" font-weight="500" fill="#fff" text-anchor="middle" >FLOW-011</text><text x="202" y="58" font-size="19" font-weight="400" fill="#5C6C7D" text-anchor="start" >EC 工单系统 · 业务流程图册</text><text x="2038" y="58" font-size="19" font-weight="500" fill="#AC6812" text-anchor="end" >草案 / 待确认 · 2026-09-26</text><text x="40" y="112" font-size="36" font-weight="600" fill="#182B42" text-anchor="start" >开票、收款与财务协作</text><text x="40" y="149" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >商务流程与工单执行关联；开票时点及财务系统集成未定稿</text><text x="42" y="203" font-size="18" font-weight="500" fill="#5C6C7D" text-anchor="start" >责任角色 / 系统</text><text x="240" y="203" font-size="18" font-weight="400" fill="#5C6C7D" text-anchor="start" >业务推进 →   实线：业务动作     虚线：状态回传 / 通知 / 待确认方案</text><rect x="40" y="226" width="2000" height="165" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="226" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="291" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >报价组 / CR / </text><text x="58" y="321" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >Project</text><rect x="40" y="392" width="2000" height="165" rx="0" fill="#F0F4F8" stroke="none" /><rect x="40" y="392" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="457" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >会计部</text><rect x="40" y="558" width="2000" height="165" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="558" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="623" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >客户</text><rect x="40" y="724" width="2000" height="165" rx="0" fill="#F0F4F8" stroke="none" /><rect x="40" y="724" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="789" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >EC / 外部财务系</text><text x="58" y="819" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >统</text><path d="M508,309 L559.1666666666667,309" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M807.1666666666667,309 L827.1666666666667,309 L827.1666666666667,475 L858.3333333333334,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1106.3333333333335,475 L1126.3333333333335,475 L1126.3333333333335,309 L1157.5,309" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1405.5,309 L1425.5,309 L1425.5,641 L1456.6666666666667,641" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1704.666666