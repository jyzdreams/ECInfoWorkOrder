ont-weight="400" fill="#5C6C7D" text-anchor="start" >接 FLOW-007A</text></g><g data-node="k"><rect x="1970" y="245" width="236" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1970" y="245" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1985" y="268" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >11  接续</text><text x="1985" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >后补报价商务处理</text><text x="1985" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >工作已完成时接 FLOW-01</text><text x="1985" y="346" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >1</text></g><rect x="40" y="908" width="2200" height="76" rx="8" fill="#FFF4DE" stroke="none" /><text x="57" y="935" font-size="18" font-weight="600" fill="#AC6812" text-anchor="start" >待确认 / 阅读提示</text><text x="250" y="935" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >修订是可选循环，不是每张报价的必经步骤；已中单后变更范围或价钱的规则待确认。</text><text x="250" y="964" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >客户 PO 是成交凭据；仓库通对供应商的采购 PO 是另一份单据。</text><text x="42" y="1008" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >来源：本轮用户说明、纯 SOP 02、知识库 FLOW-006；待确认：Q-016、AT-Q10</text><text x="2238" y="1008" font-size="17" font-weight="500" fill="#5C6C7D" text-anchor="end" >图 006 / 需求评审草案</text></g></svg>