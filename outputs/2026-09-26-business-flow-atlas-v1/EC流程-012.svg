<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1196" viewBox="0 0 2080 1196" role="img" aria-labelledby="title desc"><title id="title">FLOW-012 账号、角色权限与基础资料维护</title><desc id="desc">支撑流程｜为业务流程提供人员、客户、地点和访问范围。这是基础支撑流程，不与报价 / 派工等计作同一种客户服务入口。。正式角色权限矩阵、账号开停用责任和 Project/仓务是否独立账号仍待确认。</desc><defs><marker id="arr-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563A5"/></marker><marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168373"/></marker><marker id="arr-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#AC6812"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="2080" height="1196" rx="0" fill="#F4F7FA" stroke="none" /><rect x="0" y="0" width="2080" height="172" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="35" width="145" height="33" rx="6" fill="#182B42" stroke="none" /><text x="112" y="58" font-size="18" font-weight="500" fill="#fff" text-anchor="middle" >FLOW-012</text><text x="202" y="58" font-size="19" font-weight="400" fill="#5C6C7D" text-anchor="start" >EC 工单系统 · 业务流程图册</text><text x="2038" y="58" font-size="19" font-weight="500" fill="#AC6812" text-anchor="end" >草案 / 待确认 · 2026-09-26</text><text x="40" y="112" font-size="36" font-weight="600" fill="#182B42" text-anchor="start" >账号、角色权限与基础资料维护</text><text x="40" y="149" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >支撑流程｜为业务流程提供人员、客户、地点和访问范围</text><text x="42" y="203" font-size="18" font-weight="500" fill="#5C6C7D" text-anchor="start" >责任角色 / 系统</text><text x="240" y="203" font-size="18" font-weight="400" fill="#5C6C7D" text-anchor="start" >业务推进 →   实线：业务动作     虚线：状态回传 / 通知 / 待确认方案</text><rect x="40" y="226" width="2000" height="165" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="226" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="291" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >业务部门 / HR</text><rect x="40" y="392" width="2000" height="165" rx="0" fill="#F0F4F8" stroke="none" /><rect x="40" y="392" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="457" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >管理员</text><rect x="40" y="558" width="2000" height="165" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="558" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="623" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >EC 工单系统</text><rect x="40" y="724" width="2000" height="165" rx="0" fill="#F0F4F8" stroke="none" /><rect x="40" y="724" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="789" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >业务使用人</text><rect x="40" y="890" width="2000" height="165" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="890" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="955" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >评审 / 验证人员</text><path d="M508,309 L528,309 L528,475 L559.1666666666667,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M807.1666666666667,475 L858.3333333333334,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1106.3333333333335,475 L1126.3333333333335,475 L1126.3333333333335,641 L1157.5,641" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1405.5,641 L1425.5,641 L1425.5,807 L1456.6666666666667,807" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1405.5,641 L1436.6666666666667,641 L1436.6666666666667,973 L1456.6666666666667,973" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1704.6666666666667,973 L1724.6666666666667,973 L1724.6666666666667,475 L1755.8333333333335,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1755.8333333333335,475 L1106.3333333333335,475" fill="none" stroke="#AC6812" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-return)"/><path d="M1704.6666666666667,973 L1735.8333333333335,973 L1735.8333333333335,641 L1755.8333333333335,641" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><g data-edge-label="f-g"><rect x="1729.6666666666667" y="712" width="86" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1772.6666666666667" y="729" font-size="17" font-weight="500" fill="#2563A5" text-anchor="middle" >发现问题</text></g><g data-edge-label="g-c"><rect x="1406.0833333333335" y="452" width="50" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1431.0833333333335" y="469" font-size="17" font-weight="500" fill="#AC6812" text-anchor="middle" >修正</text></g><g data-edge-label="f-h"><rect x="1740.8333333333335" y="795" width="86" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1783.8333333333335" y="812" font-size="17" font-weight="500" fill="#2563A5" text-anchor="middle" >核对通过</text></g><g data-node="a"><rect x="260" y="245" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="260" y="245" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="275" y="268" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >01</text><text x="275" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >提供人员与业务资料</text><text x="275" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >人员、归属、客户、地点</text></g><g data-node="b"><rect x="559.1666666666667" y="411" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="559.1666666666667" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="574.1666666666667" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >02</text><text x="574.1666666666667" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >维护账号与基础资料</text><text x="574.1666666666667" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >角色、团队、区域及字典</text></g><g data-node="c"><rect x="858.3333333333334" y="411" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="858.3333333333334" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="873.3333333333334" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >03</text><text x="873.3333333333334" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >设置可见与可操作范</text><text x="873.3333333333334" y="486" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >围</text><text x="873.3333333333334" y="510" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >本人 / 团队 / 区域等</text></g><g data-node="d"><rect x="1157.5" y="577" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1157.5" y="577" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1172.5" y="600" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >04</text><text x="1172.5" y="626" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >按身份提供数据与动</text><text x="1172.5" y="652" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >作</text><text x="1172.5" y="676" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >权限必须覆盖具体记录</text></g><g data-node="e"><rect x="1456.6666666666667" y="743" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1456.6666666666667" y="743" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1471.6666666666667" y="766" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >05</text><text x="1471.6666666666667" y="792" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >执行本角色业务</text><text x="1471.6666666666667" y="823" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >接各业务流程</text></g><g data-node="f"><rect x="1456.6666666666667" y="909" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1456.6666666666667" y="909" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1471.6666666666667" y="932" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >06</text><text x="1471.6666666666667" y="958" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >用真实角色核对权限</text><text x="1471.6666666666667" y="989" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >可看、可改、分派、导出</text></g><g data-node="g"><rect x="1755.8333333333335" y="411" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1755.8333333333335" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1770.8333333333335" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >07</text><text x="1770.8333333333335" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >修正权限或资料问题</text><text x="1770.8333333333335" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >规则变更需保留依据</text></g><g data-node="h"><rect x="1755.8333333333335" y="577" width="248" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1755.8333333333335" y="577" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1770.8333333333335" y="600" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >08  结果</text><text x="1770.8333333333335" y="626" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >按核对结果提供支持</text><text x="1770.8333333333335" y="657" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >账号停用等具体规则待确认</text></g><rect x="40" y="1074" width="2000" height="76" rx="8" fill="#FFF4DE" stroke="none" /><text x="57" y="1101" font-size="18" font-weight="600" fill="#AC6812" text-anchor="start" >待确认 / 阅读提示</text><text x="250" y="1101" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >这是基础支撑流程，不与报价 / 派工等计作同一种客户服务入口。</text><text x="250" y="1130" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >正式角色权限矩阵、账号开停用责任和 Project/仓务是否独立账号仍待确认。</text><text x="42" y="1174" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >来源：知识库 FLOW-012、现有需求与审计；待确认：Q-006、Q-012、Q-020</text><text x="2038" y="1174" font-size="17" font-weight="500" fill="#5C6C7D" text-anchor="end" >图 012 / 需求评审草案</text></g></svg>