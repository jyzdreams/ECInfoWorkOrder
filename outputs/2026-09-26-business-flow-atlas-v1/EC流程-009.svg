<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="1030" viewBox="0 0 2280 1030" role="img" aria-labelledby="title desc"><title id="title">FLOW-009 CM 插单与原 PM 排程重安排</title><desc id="desc">SOP 保留师傅接受与不接受两条路径；CM/PM 正式分类映射仍待确认。接受 CM 不等于删除原 PM 工作；原任务须明确重新安排及承接人。。原型部分场景隐藏拒绝按钮，与 SOP 有冲突；本图不据此取消师傅选择权。</desc><defs><marker id="arr-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563A5"/></marker><marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168373"/></marker><marker id="arr-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#AC6812"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="2280" height="1030" rx="0" fill="#F4F7FA" stroke="none" /><rect x="0" y="0" width="2280" height="172" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="35" width="145" height="33" rx="6" fill="#182B42" stroke="none" /><text x="112" y="58" font-size="18" font-weight="500" fill="#fff" text-anchor="middle" >FLOW-009</text><text x="202" y="58" font-size="19" font-weight="400" fill="#5C6C7D" text-anchor="start" >EC 工单系统 · 业务流程图册</text><text x="2238" y="58" font-size="19" font-weight="500" fill="#AC6812" text-anchor="end" >草案 / 待确认 · 2026-09-26</text><text x="40" y="112" font-size="36" font-weight="600" fill="#182B42" text-anchor="start" >CM 插单与原 PM 排程重安排</text><text x="40" y="149" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >SOP 保留师傅接受与不接受两条路径；CM/PM 正式分类映射仍待确认</text><text x="42" y="203" font-size="18" font-weight="500" fill="#5C6C7D" text-anchor="start" >责任角色 / 系统</text><text x="240" y="203" font-size="18" font-weight="400" fill="#5C6C7D" text-anchor="start" >业务推进 →   实线：业务动作     虚线：状态回传 / 通知 / 待确认方案</text><rect x="40" y="226" width="2200" height="165" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="226" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="291" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >主管 / CR / CS</text><rect x="40" y="392" width="2200" height="165" rx="0" fill="#F0F4F8" stroke="none" /><rect x="40" y="392" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="457" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >师傅 A</text><rect x="40" y="558" width="2200" height="165" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="558" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="623" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >EC 工单系统</text><rect x="40" y="724" width="2200" height="165" rx="0" fill="#F0F4F8" stroke="none" /><rect x="40" y="724" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="789" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >替补师傅 B</text><path d="M496,309 L516,309 L516,475 L545,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M781,475 L830,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M781,475 L801,475 L801,557 L1950,557 L1950,475 L1970,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1066,475 L1115,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1066,475 L1086,475 L1086,393 L1380,393 L1380,475 L1400,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1351,475 L1371,475 L1371,641 L1400,641" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1518,539 L1518,577" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1636,641 L1656,641 L1656,309 L1685,309" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1921,309 L1941,309 L1941,807 L1970,807" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1351,475 L1371,475 L1371,391 L1380,391 L1380,393 L1950,393 L1950,475 L1970,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1636,475 L1970,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><g data-edge-label="b-c"><rect x="774.5" y="382" width="62" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="805.5" y="399" font-size="17" font-weight="500" fill="#2563A5" text-anchor="middle" >有 PM</text></g><g data-edge-label="b-i"><rect x="1302.5" y="382" width="146" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1375.5" y="399" font-size="17" font-weight="500" fill="#2563A5" text-anchor="middle" >无 PM，执行 CM</text></g><g data-edge-label="c-d"><rect x="1065.5" y="382" width="50" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1090.5" y="399" font-size="17" font-weight="500" fill="#2563A5" text-anchor="middle" >接受</text></g><g data-edge-label="c-e"><rect x="1199" y="370" width="68" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1233" y="387" font-size="17" font-weight="500" fill="#2563A5" text-anchor="middle" >不接受</text></g><g data-edge-label="d-f"><rect x="1376" y="546" width="126" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1439" y="563" font-size="17" font-weight="500" fill="#2563A5" text-anchor="middle" >原 PM 待重排</text></g><g data-edge-label="e-f"><rect x="1523" y="546" width="98" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1572" y="563" font-size="17" font-weight="500" fill="#2563A5" text-anchor="middle" >CM 待重排</text></g><g data-edge-label="d-i"><rect x="1639.5" y="382" width="42" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1660.5" y="399" font-size="17" font-weight="500" fill="#2563A5" text-anchor="middle" >CM</text></g><g data-edge-label="e-i"><rect x="1772" y="452" width="62" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1803" y="469" font-size="17" font-weight="500" fill="#2563A5" text-anchor="middle" >原 PM</text></g><g data-node="a"><rect x="260" y="245" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="260" y="245" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="275" y="268" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >01</text><text x="275" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >分派 CM 任务</text><text x="275" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >检查当前人员排程</text></g><g data-node="b"><rect x="545" y="411" width="236" height="128" rx="24" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="545" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="560" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >02  判断</text><text x="560" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >是否已有 PM 排程？</text><text x="560" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >无排程可直接执行 CM</text></g><g data-node="c"><rect x="830" y="411" width="236" height="128" rx="24" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="830" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="845" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >03  判断</text><text x="845" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >接受 CM？</text><text x="845" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >SOP 保留选择权</text></g><g data-node="d"><rect x="1115" y="411" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1115" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1130" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >04</text><text x="1130" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >接受：执行 CM</text><text x="1130" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >原 PM 需交回重排</text></g><g data-node="e"><rect x="1400" y="411" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1400" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1415" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >05</text><text x="1415" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >不接受：继续原 PM</text><text x="1415" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >CM 需另找师傅</text></g><g data-node="f"><rect x="1400" y="577" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1400" y="577" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1415" y="600" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >06</text><text x="1415" y="626" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >通知并保留变更记录</text><text x="1415" y="657" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >明确受影响的 PM 或 CM</text></g><g data-node="g"><rect x="1685" y="245" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1685" y="245" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1700" y="268" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >07</text><text x="1700" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >分别重派 PM / CM</text><text x="1700" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >权限与通知对象待确认</text></g><g data-node="h"><rect x="1970" y="743" width="236" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1970" y="743" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1985" y="766" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >08  接续</text><text x="1985" y="792" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >接收替补任务</text><text x="1985" y="823" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >接 FLOW-003/004</text></g><g data-node="i"><rect x="1970" y="411" width="236" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1970" y="411" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1985" y="434" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >09  接续</text><text x="1985" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >执行 CM / 保留 PM</text><text x="1985" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >接 FLOW-004</text></g><rect x="40" y="908" width="2200" height="76" rx="8" fill="#FFF4DE" stroke="none" /><text x="57" y="935" font-size="18" font-weight="600" fill="#AC6812" text-anchor="start" >待确认 / 阅读提示</text><text x="250" y="935" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >接受 CM 不等于删除原 PM 工作；原任务须明确重新安排及承接人。</text><text x="250" y="964" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >原型部分场景隐藏拒绝按钮，与 SOP 有冲突；本图不据此取消师傅选择权。</text><text x="42" y="1008" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >来源：纯 SOP 01、FLOW-009、对齐审计；待确认：Q-008、Q-012；PM/CM 与 M/P 不是同一分类</text><text x="2238" y="1008" font-size="17" font-weight="500" fill="#5C6C7D" text-anchor="end" >图 009 / 需求评审草案</text></g></svg>