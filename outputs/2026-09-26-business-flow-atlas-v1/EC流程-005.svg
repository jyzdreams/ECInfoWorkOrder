<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1030" viewBox="0 0 2080 1030" role="img" aria-labelledby="title desc"><title id="title">FLOW-005 完工提交、确认与退回处理</title><desc id="desc">“直接完成”与“主管审核”是待选方案；客户签认已在现场流程中完成。A/B 为互斥候选，不能把两条都当成客户已经同意的必经流程。。业务处理未完不因上传过一次 SR 就自动关单；最终完成条件需要真实案例确认。</desc><defs><marker id="arr-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563A5"/></marker><marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168373"/></marker><marker id="arr-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#AC6812"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="2080" height="1030" rx="0" fill="#F4F7FA" stroke="none" /><rect x="0" y="0" width="2080" height="172" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="35" width="145" height="33" rx="6" fill="#182B42" stroke="none" /><text x="112" y="58" font-size="18" font-weight="500" fill="#fff" text-anchor="middle" >FLOW-005</text><text x="202" y="58" font-size="19" font-weight="400" fill="#5C6C7D" text-anchor="start" >EC 工单系统 · 业务流程图册</text><text x="2038" y="58" font-size="19" font-weight="500" fill="#AC6812" text-anchor="end" >草案 / 待确认 · 2026-09-26</text><text x="40" y="112" font-size="36" font-weight="600" fill="#182B42" text-anchor="start" >完工提交、确认与退回处理</text><text x="40" y="149" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >“直接完成”与“主管审核”是待选方案；客户签认已在现场流程中完成</text><text x="42" y="203" font-size="18" font-weight="500" fill="#5C6C7D" text-anchor="start" >责任角色 / 系统</text><text x="240" y="203" font-size="18" font-weight="400" fill="#5C6C7D" text-anchor="start" >业务推进 →   实线：业务动作     虚线：状态回传 / 通知 / 待确认方案</text><rect x="40" y="226" widt