dth="86" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1580.6666666666667" y="469" font-size="17" font-weight="500" fill="#168373" text-anchor="middle" >直接完成</text></g><g data-edge-label="e-g"><rect x="1545.6666666666667" y="618" width="50" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1570.6666666666667" y="635" font-size="17" font-weight="500" fill="#168373" text-anchor="middle" >通过</text></g><g data-edge-label="e-f"><rect x="1430.5" y="504" width="50" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="1455.5" y="521" font-size="17" font-weight="500" fill="#168373" text-anchor="middle" >退回</text></g><g data-edge-label="f-a"><rect x="939.3333333333334" y="202" width="86" height="23" rx="4" fill="#F8FAFC" stroke="none" /><text x="982.3333333333334" y="219" font-size="17" font-weight="500" fill="#AC6812" text-anchor="middle" >重新提交</text></g><g data-node="a"><rect x="260" y="245" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="260" y="245" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="275" y="268" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >01</text><text x="275" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >提交完整完工资料</text><text x="275" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >SR / 完工单、签认、附件</text></g><g data-node="b"><rect x="559.1666666666667" y="411" width="248" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="559.1666666666667" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="574.1666666666667" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >02</text><text x="574.1666666666667" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >检查完成条件 / 资料</text><text x="574.1666666666667" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >多 SR、必填与例外规则待定</text></g><g data-node="c"><r