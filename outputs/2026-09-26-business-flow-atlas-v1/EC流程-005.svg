tart" >06</text><text x="1471.6666666666667" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >补资料 / 返工</text><text x="1471.6666666666667" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >不满足条件或审核退回</text></g><g data-node="g"><rect x="1755.8333333333335" y="411" width="248" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1755.8333333333335" y="411" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1770.8333333333335" y="434" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >07  结果</text><text x="1770.8333333333335" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >记录工单完成</text><text x="1770.8333333333335" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >主状态命名另行统一</text></g><g data-node="h"><rect x="1755.8333333333335" y="743" width="248" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1755.8333333333335" y="743" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1770.8333333333335" y="766" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >08  接续</text><text x="1770.8333333333335" y="792" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >归档报告 / 通知</text><text x="1770.8333333333335" y="823" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >接 FLOW-008；商务见 011</text></g><rect x="40" y="908" width="2000" height="76" rx="8" fill="#FFF4DE" stroke="none" /><text x="57" y="935" font-size="18" font-weight="600" fill="#AC6812" text-anchor="start" >待确认 / 阅读提示</text><text x="250" y="935" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >A/B 为互斥候选，不能把两条都当成客户已经同意的必经流程。</text><text x="250" y="964" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >业务处理未完不因上传过一次 SR 就自动关单；最终完成条件需要真实案例确认。</text><text x="42" y="1008" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >来源：知识库 FLOW-