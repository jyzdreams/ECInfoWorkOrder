ize="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >维修 / 保养 / 安装</text></g><g data-node="c"><rect x="830" y="245" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="830" y="245" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="845" y="268" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >03</text><text x="845" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >完成处理与用料记录</text><text x="845" y="325" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >处理后照片或替代证明</text></g><g data-node="d"><rect x="1115" y="411" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1115" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1130" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >04</text><text x="1130" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >确认处理结果</text><text x="1130" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >签名 / 盖章</text></g><g data-node="e"><rect x="1400" y="245" width="236" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1400" y="245" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1415" y="268" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >05  接续</text><text x="1415" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >提交 SR / 完工资</text><text x="1415" y="320" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >料</text><text x="1415" y="344" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >接 FLOW-005</text></g><g data-node="f"><rect x="1115" y="245" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1115" y="245" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1130" y="268" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >06</text><text x="1130" y="294" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >不能即时处理：写 S</text><text x="1130" y="320" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >R</text><text x="1130" y="344" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >故障、材料、报价需求</text></g><g data-node="g"><rect x="1400" y="411" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1400" y="411" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1415" y="434" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >07</text><text x="1415" y="460" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >确认现场报告</text><text x="1415" y="491" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >确认报告不等于接受报价</text></g><g data-node="h"><rect x="1685" y="577" width="236" height="128" rx="11" fill="#FFFFFF" stroke="#CBD5DF" /><rect x="1685" y="577" width="5" height="128" rx="2" fill="#2563A5" stroke="none" /><text x="1700" y="600" font-size="15" font-weight="500" fill="#2563A5" text-anchor="start" >08</text><text x="1700" y="626" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >记录报价请求 / 通</text><text x="1700" y="652" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >知</text><text x="1700" y="676" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >关联原工单与服务报告</text></g><g data-node="i"><rect x="1970" y="743" width="236" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1970" y="743" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1985" y="766" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >09  接续</text><text x="1985" y="792" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >接收正常报价请求</text><text x="1985" y="823" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >接 FLOW-006</text></g><g data-node="j"><rect x="1685" y="743" width="236" height="128" rx="11" fill="#E5F2EC" stroke="#CBD5DF" /><rect x="1685" y="743" width="5" height="128" rx="2" fill="#168373" stroke="none" /><text x="1700" y="766" font-size="15" font-weight="500" fill="#168373" text-anchor="start" >10  接续</text><text x="1700" y="792" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >接收后补报价请求</text><text x="1700" y="823" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >已完成工作，仅补商务手续</text></g><rect x="40" y="908" width="2200" height="76" rx="8" fill="#FFF4DE" stroke="none" /><text x="57" y="935" font-size="18" font-weight="600" fill="#AC6812" text-anchor="start" >待确认 / 阅读提示</text><text x="250" y="935" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >不可拍照地点的替代证明、迟到通知阈值、照片要求均待确认；不套用原型演示阈值。</text><text x="250" y="964" font-size="19" font-weight="400" fill="#182B42" text-anchor="start" >后补报价不等于一定需要二次施工；同一工单多份 SR 是否全部齐备，完工时要核对。</text><text x="42" y="1008" font-size="17" font-weight="400" fill="#5C6C7D" text-anchor="start" >来源：纯 SOP 02、知识库 FLOW-004/006；单据：SR 服务报告、完工纸；待确认：Q-009、Q-011、Q-015</text><text x="2238" y="1008" font-size="17" font-weight="500" fill="#5C6C7D" text-anchor="end" >图 004 / 需求评审草案</text></g></svg>