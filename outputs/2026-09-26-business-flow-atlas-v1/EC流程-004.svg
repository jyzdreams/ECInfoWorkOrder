<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="1030" viewBox="0 0 2280 1030" role="img" aria-labelledby="title desc"><title id="title">FLOW-004 到场处理、现场报价与后补报价</title><desc id="desc">入口：师傅已接单｜即时完成和无法即时处理必须分开。不可拍照地点的替代证明、迟到通知阈值、照片要求均待确认；不套用原型演示阈值。。后补报价不等于一定需要二次施工；同一工单多份 SR 是否全部齐备，完工时要核对。</desc><defs><marker id="arr-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563A5"/></marker><marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168373"/></marker><marker id="arr-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#AC6812"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="2280" height="1030" rx="0" fill="#F4F7FA" stroke="none" /><rect x="0" y="0" width="2280" height="172" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="35" width="145" height="33" rx="6" fill="#182B42" stroke="none" /><text x="112" y="58" font-size="18" font-weight="500" fill="#fff" text-anchor="middle" >FLOW-004</text><text x="202" y="58" font-size="19" font-weight="400" fill="#5C6C7D" text-anchor="start" >EC 工单系统 · 业务流程图册</text><text x="2238" y="58" font-size="19" font-weight="500" fill="#AC6812" text-anchor="end" >草案 / 待确认 · 2026-09-26</text><text x="40" y="112" font-size="36" font-weight="600" fill="#182B42" text-anchor="start" >到场处理、现场报价与后补报价</text><text x="40" y="149" font-size="21" font-weight="400" fill="#5C6C7D" text-anchor="start" >入口：师傅已接单｜即时完成和无法即时处理必须分开</text><text x="42" y="203" font-size="18" font-weight="500" fill="#5C6C7D" text-anchor="start" >责任角色 / 系统</text><text x="240" y="203" font-size="18" font-weight="400" fill="#5C6C7D" text-anchor="start" >业务推进 →   实线：业务动作     虚线：状态回传 / 通知 / 待确认方案</text><rect x="40" y="226" width="2200" height="165" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="226" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="291" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >师傅</text><rect x="40" y="392" width="2200" height="165" rx="0" fill="#F0F4F8" stroke="none" /><rect x="40" y="392" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="457" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >客户</text><rect x="40" y="558" width="2200" height="165" rx="0" fill="#FFFFFF" stroke="none" /><rect x="40" y="558" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="623" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >EC 工单系统</text><rect x="40" y="724" width="2200" height="165" rx="0" fill="#F0F4F8" stroke="none" /><rect x="40" y="724" width="175" height="165" rx="0" fill="#E7EDF3" stroke="none" /><text x="58" y="789" font-size="22" font-weight="500" fill="#182B42" text-anchor="start" >报价组</text><path d="M496,309 L545,309" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M781,309 L830,309" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1066,309 L1086,309 L1086,475 L1115,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1351,475 L1371,475 L1371,309 L1400,309" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M781,309 L801,309 L801,391 L1095,391 L1095,309 L1115,309" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1351,309 L1380,309 L1380,475 L1400,475" fill="none" stroke="#2563A5" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arr-main)"/><path d="M1636,475 L1656,475 L1656,641 L1685,641" fill="none" st