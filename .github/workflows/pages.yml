name: Deploy static prototype to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'jyzdreams/ECInfoWorkOrder' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'jyzdreams' &&
      github.triggering_actor == 'jyzdreams'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static artifact
        run: |
          mkdir -p _site/assets _site/mobile/components _site/mobile/pages
          mkdir -p _site/prototype/assets _site/prototype/mobile/components _site/prototype/mobile/pages

          cp prototype/index.html prototype/ui-upgrade.css prototype/ec-brand.css prototype/workbench.css prototype/remediation.js prototype/workbench.js prototype/logo_ecinfo.svg _site/
          cp prototype/index.html prototype/ui-upgrade.css prototype/ec-brand.css prototype/workbench.css prototype/remediation.js prototype/workbench.js prototype/logo_ecinfo.svg _site/prototype/
          cp prototype/assets/ecinfo-official.svg _site/assets/
          cp prototype/assets/ecinfo-official.svg _site/prototype/assets/

          cp prototype/mobile/index.html prototype/mobile/styles.css prototype/mobile/app.js prototype/mobile/store.js prototype/mobile/fixtures.json _site/mobile/
          cp -R prototype/mobile/components/. _site/mobile/components/
          cp -R prototype/mobile/pages/. _site/mobile/pages/
          cp prototype/mobile/index.html prototype/mobile/styles.css prototype/mobile/app.js prototype/mobile/store.js prototype/mobile/fixtures.json _site/prototype/mobile/
          cp -R prototype/mobile/components/. _site/prototype/mobile/components/
          cp -R prototype/mobile/pages/. _site/prototype/mobile/pages/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
