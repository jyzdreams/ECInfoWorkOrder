name: Deploy static prototype to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'jyzdreams/ECInfoWorkOrder' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'jyzdreams' &&
      github.triggering_actor == 'jyzdreams'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static artifact
        run: |
          mkdir -p _site/prototype
          cp prototype/index.html _site/index.html
          cp prototype/ui-upgrade.css _site/ui-upgrade.css
          cp prototype/remediation.js _site/remediation.js
          cp prototype/logo_ecinfo.svg _site/logo_ecinfo.svg
          cp prototype/index.html _site/prototype/index.html
          cp prototype/ui-upgrade.css _site/prototype/ui-upgrade.css
          cp prototype/remediation.js _site/prototype/remediation.js
          cp prototype/logo_ecinfo.svg _site/prototype/logo_ecinfo.svg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
